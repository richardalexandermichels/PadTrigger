name: Windows VST3

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-check:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Configure with pinned JUCE
        run: cmake -S . -B build/ci -G "Visual Studio 17 2022" -A x64 -DPADTRIGGER_BUILD_TESTS=ON
      - name: Build the VST3 and processor checks
        run: cmake --build build/ci --config Release --target PadTrigger_VST3 PadTriggerTests --parallel 2
      - name: Run processor and editor checks
        run: ctest --test-dir build/ci -C Release --output-on-failure
      - name: Verify release package
        run: |
          cmake --install build/ci --config Release --component Padomizer --prefix build/package
          ./Tests/VerifyRelease.ps1 -PackagePath build/package
